<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Sample architecture diagram">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg2)"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#0f172a">
    <g>
      <rect x="60" y="60" width="180" height="80" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="150" y="100" text-anchor="middle" font-weight="600">content/notes/</text>
      <text x="150" y="120" text-anchor="middle" fill="#475569" font-size="13">user-owned</text>
    </g>
    <g>
      <rect x="310" y="60" width="180" height="80" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="400" y="100" text-anchor="middle" font-weight="600">FS Adapter</text>
      <text x="400" y="120" text-anchor="middle" fill="#475569" font-size="13">parse + extract</text>
    </g>
    <g>
      <rect x="560" y="60" width="180" height="80" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="650" y="100" text-anchor="middle" font-weight="600">Domain Core</text>
      <text x="650" y="120" text-anchor="middle" fill="#475569" font-size="13">pure use-cases</text>
    </g>
    <g>
      <rect x="310" y="240" width="180" height="80" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="400" y="280" text-anchor="middle" font-weight="600" fill="#5b21b6">NoteArticle</text>
      <text x="400" y="300" text-anchor="middle" fill="#5b21b6" font-size="13">rendered HTML</text>
    </g>
    <g stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
      <line x1="240" y1="100" x2="310" y2="100"/>
      <line x1="490" y1="100" x2="560" y2="100"/>
      <line x1="650" y1="140" x2="650" y2="220"/>
      <path d="M650 220 Q650 280 490 280"/>
      <line x1="400" y1="140" x2="400" y2="240"/>
    </g>
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
      </marker>
    </defs>
  </g>
</svg>
